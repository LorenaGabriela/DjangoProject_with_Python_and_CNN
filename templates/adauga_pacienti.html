<!DOCTYPE html>
<html lang="en">
<head>
<style>
.my-custom-class {
    border: 5px solid #ccc;
    padding: 8px;
    border-radius: 4px;
    width: 40%;
    box-sizing: border-box;
    margin-bottom: 10px;
    margin-top: 10px;
}
.hamburger {
    display: none;
    font-size: 30px;
    cursor: pointer;
    color: #fff; /* Hamburger alb */
}


/* Setări pentru ecrane mici */
@media screen and (max-width: 600px) {

    .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 60px; /* înălțimea headerului */
        left: 0;
        margin-top: 40px;
    }

    .nav-links ul {
        flex-direction: column;
        width: 100%;
                text-align: left;

    }

    .nav-links ul li {
        margin: 10px 0;
        text-align: left;
    }

    .hamburger {
        display: block;
    }

    .nav-active {
        display: flex;
    }
    nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 70px 20px; /* Ajustează padding-ul pentru a muta elementele mai jos */
    border-bottom: 1px solid #ddd; /* Linie de separare subtilă */
}}
   {% load static %}

</style>

    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>HomePage</title>
</head>
<body>
<header>


    <nav>

    <a style="font-family: Monospace, sans-serif; font-size: 40px; ">

    </a>
</a>


            <ul>



                    <a href="/pacienti"  class="nav-button">Inapoi</a>


            </ul>

    </nav>

<script>
    function toggleMenu() {
    var navLinks = document.querySelector('.nav-links');
    navLinks.classList.toggle('nav-active');
}

</body>

</html>
