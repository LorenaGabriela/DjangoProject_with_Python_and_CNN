<!DOCTYPE html>
<html lang="en">
<head>
<style>
.background{
    width: 460px;
    height: 720px;
    position: absolute;
    transform: translate(-50%,-50%);
    left: 50%;
    top: 50%;
}
<!--.background .shape{-->
<!--    height: 200px;-->
<!--    width: 200px;-->
<!--    position: absolute;-->
<!--    border-radius: 50%;-->
<!--}-->

.shape:first-child{
    background: linear-gradient(
        #1845ad,
        #23a2f6
    );
    left: -80px;
    top: -80px;
}
.shape:last-child{
    background: linear-gradient(
        to right,
        #ff512f,
        #f09819
    );
    right: -30px;
    bottom: -80px;
}
form{
    height: 350px;
    width: 350px;
    background-color: rgba(255,255,255,0.13);
    position: absolute;
    transform: translate(-50%, -52%);
    top: 50%;
    left: 50%;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 40px rgba(8,7,16,0.6);
    padding: 50px 35px;
}
form {
    width:90%;
    max-width: 800px;
    margin: 0 auto;
}
form *{
    font-family: 'Poppins',sans-serif;
    color: #ffffff;
    letter-spacing: 0.5px;
    outline: none;
    border: none;
    font-size: 15px;
}
form h3{
    font-size: 20px;
    font-weight: 400;
    line-height: 30px;
    text-align: center;
    margin-top: -20px;
}

label{
    display: block;
    margin-top: 20px;
    font-size: 16px;
    font-weight: 500;
}
input{
    display: block;
    height: 25px;
    width: 100%;
    background-color: rgba(255,255,255,0.07);
    border-radius: 3px;
    padding: 0 10px;
    margin-top: 2px;
    font-size: 14px;
    font-weight: 300;
}
::placeholder{
    color: #e5e5e5;
}
button{
    margin-top: 20px;
    width: 100%;
    background-color: #ffffff;
    color: #080710;
    padding: 10px 0;
    font-size: 16px;
    font-weight: 600;
    border-radius: 5px;
    cursor: pointer;
}

.hamburger {
    display: none;
    font-size: 30px;
    cursor: pointer;
    color: #fff; /* Hamburger alb */
}
/* Setări pentru ecrane mici */
@media screen and (max-width: 600px) {
.hamburger {
        display: block;
    }
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 70px 20px; /* Ajustează padding-ul pentru a muta elementele mai jos */
    border-bottom: 1px solid #ddd; /* Linie de separare subtilă */
}
    form {
    width:50%;
    max-width: 800px;
    margin: 0 auto;
    margin-top: 60px;
}
.nav-links {
margin-top: 50px;
        display: none;
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 60px; /* înălțimea headerului */
        left: 0;
        z-index: 1000;
    }

    .nav-links ul {
        flex-direction: column;
        width: 100%;
                text-align: left;

    }

    .nav-links ul li {
        margin: 10px 0;
        text-align: left;
    }
    .nav-active {
        display: flex;
    }


}
   {% load static %}

</style>
 <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">



    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Medical Website Register Pacient</title>
</head>
<body>
<header>

{% load static %}
    <nav>

    <a href="/">
       <a style="font-family: Monospace, sans-serif; font-size: 40px; display: inline-block; margin-top: 30px;">
         Medica
    </a>
    </a>
         <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
        <div class="nav-links">

            <ul>
                <li>
                    <a href="/">Inapoi</a>
                </li>
                <li>
                    <a href="">Despre noi</a>
                </li>
                <li>
                    <a href="">Contact</a>
                </li>


            </ul>
        </div>
    </nav>

</header>

<div class="background">
        <div class="shape"></div>
        <div class="shape"></div>

    <form  class="form-background" method="POST" autocomplete="off">
        {% csrf_token %}
                <h3>Înregistrare</h3>

        <label for="id_username">Nume utilizator:</label>
    {{ registerform.username }}


    <label for="id_email">Email:</label>
    {{ registerform.email }}


    <label for="id_password1">Parolă:</label>
    {{ registerform.password1 }}


    <label for="id_password2">Confirmare parolă:</label>
    {{ registerform.password2 }}
        <a href="{% url 'home' %}">
    <button type="submit">Înregistreaza-te</button>
</a>
</form>
</div>

<script>
    function toggleMenu() {
    var navLinks = document.querySelector('.nav-links');
    navLinks.classList.toggle('nav-active');
}
</script>
</body>

</html>
